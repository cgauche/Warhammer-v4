<script>
    var Compendium = function (CharGen) {
        var oThat = {};
        oThat.stepName = "Compendium";
        oThat.desc = function () {
            return ''
        };
        oThat.title = function () {
            return 'Compendium'
        };
        oThat.initAction = function () {
            if (!CharGen.data) {
                CharGen.loadData();
                CharGen.initHelp();
            }
        };

        oThat.cancelAction = function () {
            $('.cancel').html('Retour');
            $('.cancel').off('click').on('click', function () {
                CharGen.showMainMenu();
            });
        };

        oThat.show = function () {
            var con = $('.left_panel').html('');
            /** Races **/
            var species = CharGen.data.species;
            var currentDetail = '';
            var tmp = '';
            var displayedSpecies = [];
            $(species).each(function (i, el) {
                var tmpDetail = el.refDetail;
                var mySpecie = Helper.clone(el);
                if (currentDetail !== tmpDetail) {
                    currentDetail = tmpDetail;
                    tmp = Helper.clone(mySpecie);
                    tmp.level = 1;
                    tmp.label = tmpDetail;
                    displayedSpecies[displayedSpecies.length] = tmp;
                }
                if (typeof species[i + 1] !== 'undefined' && species[i + 1].refDetail === currentDetail) {
                    mySpecie.level = 2;
                    displayedSpecies[displayedSpecies.length] = mySpecie;
                }
            });
            /** Attributs **/
            var characteristics = CharGen.data.characteristics;
            /** Carrières **/
            var careers = CharGen.data.careers;
            var currentClass = '';
            var displayedCareers = [];
            $(careers).each(function (i) {
                var el = careers[i];
                var tmpClass = el.getClass();
                if (currentClass !== tmpClass.getLabel()) {
                    currentClass = tmpClass.getLabel();
                    tmp = Helper.clone(tmpClass);
                    tmp.level = 1;
                    displayedCareers[displayedCareers.length] = tmp;
                }
                tmp = Helper.clone(el);
                tmp.level = 2;
                displayedCareers[displayedCareers.length] = tmp;
                (CharGen.allCareersLevelsByGroup[el.id]).forEach(function (el, i) {
                    var myCareer = Helper.clone(el);
                    myCareer.level = 3;
                    displayedCareers[displayedCareers.length] = myCareer;
                })
            });
            /** TALENTS **/
            var talents = CharGen.data.talents;
            /** Compétence **/
            var skills = CharGen.data.skills;
            /** Sorts **/
            var spells = CharGen.data.spells;
            var currentType = '';
            var currentSpec = '';
            var displayedSpells = [];
            $(spells).each(function (i, el) {
                if (currentType !== spells[i].type) {
                    currentType = spells[i].type;
                    tmp = Helper.clone(CharGen.allTalents[Helper.toId(currentType)]);
                    tmp.altLabel = currentType;
                    tmp.level = 1;
                    displayedSpells[displayedSpells.length] = tmp;
                }
                if (currentSpec !== spells[i].spec) {
                    currentSpec = spells[i].spec;
                    if (!(tmp = CharGen.allGods[Helper.toId(currentSpec)])
                        || typeof tmp === 'undefined') {
                        tmp = CharGen.allLore[Helper.toId(currentSpec)];
                    }
                    if (typeof tmp === 'undefined') {
                        tmp = {
                            book: '',
                            page: '',
                        }
                    }
                    tmp = Helper.clone(tmp);
                    tmp.altLabel = currentSpec;
                    tmp.level = 2;
                    displayedSpells[displayedSpells.length] = tmp;
                }
                tmp = Helper.clone(spells[i]);
                tmp.level = 3
                displayedSpells[displayedSpells.length] = tmp;
            });
            /** Equipements **/
            var trappings = CharGen.data.trappings;
            currentType = '';
            currentSpec = '';
            var displayedTrappings = [];

            $(trappings).each(function (i, el) {
                if (trappings[i].type && currentType !== trappings[i].type) {
                    currentType = trappings[i].type;
                    displayedTrappings[displayedTrappings.length] = {
                        label: currentType,
                        desc: '',
                        level: 1
                    };
                }
                if (trappings[i].spec && currentSpec !== trappings[i].spec) {
                    currentSpec = trappings[i].spec;
                    displayedTrappings[displayedTrappings.length] = {
                        label: currentSpec,
                        desc: '',
                        level: 2
                    };
                }
                tmp = Helper.clone(trappings[i]);
                tmp.level = 3
                displayedTrappings[displayedTrappings.length] = tmp;
            });
            /** Livres **/
            var books = CharGen.data.books;
            /** Lore **/
            var lore = CharGen.data.lore;

            var tabEl = {
                'Races': {elems: displayedSpecies},
                'Caractéristiques': {elems: characteristics},
                'Carrières': {elems: displayedCareers},
                'Talents': {elems: talents},
                'Compétences': {elems: skills},
                'Sorts': {elems: displayedSpells},
                'Possessions': {elems: displayedTrappings},
                'Livres': {elems: books},
                'Lieux': {
                    elems: lore, filter: function (i, el) {
                        return el.spec === 'lore'
                    }
                },
                'Atouts/Defauts': {
                    elems: lore, filter: function (i, el) {
                        return el.spec === 'equipment'
                    }
                },
                'Psychologie': {
                    elems: lore, filter: function (i, el) {
                        return el.spec === 'psychologie'
                    }
                },
                'États': {
                    elems: lore, filter: function (i, el) {
                        return el.spec === 'etat'
                    }
                },
                'Traits de créature': {
                    elems: lore, filter: function (i, el) {
                        return el.spec === 'trait'
                    }
                }
            };

            var i = 1;
            var html = '<select class="div_label ui-widget-content" style="text-align: center;padding: 0.4em;">'
            for (let [label, el] of Object.entries(tabEl)) {
                html += '<option value="tabs-' + i + '">' + label + '</option>';
                ++i;
            }
            html += '</select>';
            con.append(html);
            i = 1;
            for (let [label, el] of Object.entries(tabEl)) {
                con.append('<div id="tabs-' + i + '" class="pretty_panel paneltabs overflow_panel" style="display: none"></div>');
                var talentstab = con.find('#tabs-' + i);
                Helper.generateNormalList(
                    el.elems,
                    typeof el.filter !== 'undefined' ? el.filter : null,
                    null,
                    talentstab,
                    CharGen
                );
                ++i;
            }
            con.children('select').off('change').on('change', function (i, e) {
                var val = $(this).val();
                con.children('div').hide();
                con.find('#' + val).show();
            })
            con.children('select').change();
        };
        return oThat;
    }
</script>
